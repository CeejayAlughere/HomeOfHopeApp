
# XISD6329 - Android Kotlin CI Pipeline

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'macos-latest'

steps:
  - checkout: self

  - script: chmod +x ./gradlew
    displayName: 'Make Gradle wrapper executable'

  - task: Gradle@3
    displayName: 'Build Android app, run unit tests and lint'
    inputs:
      workingDirectory: ''
      gradleWrapperFile: 'gradlew'
      gradleOptions: '-Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/TEST-*.xml'
      tasks: 'testDebugUnitTest lintDebug assembleDebug'

  - task: CopyFiles@2
    displayName: 'Collect debug APK'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**/build/outputs/apk/debug/*.apk'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/apk'
      flattenFolders: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish debug APK'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/apk'
      artifact: 'Android-Debug-APK'
      publishLocation: 'pipeline'
